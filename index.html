<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Gastos Pessoais</title>
  <style>
    /* Estilos gerais e reset básico */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f0f2f5;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Cartão principal do formulário */
    .container {
      background-color: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    h1 {
      font-size: 1.5rem;
      color: #1a73e8;
      text-align: center;
      margin-bottom: 8px;
    }

    p.subtitulo {
      text-align: center;
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    /* Organização dos campos */
    .campo {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.9rem;
      color: #444;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #1a73e8;
    }

    /* Botão de envio */
    button {
      width: 100%;
      padding: 14px;
      background-color: #1a73e8;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 8px;
    }

    button:hover {
      background-color: #1557b0;
    }

    /* Estilo do botão enquanto está enviando */
    button:disabled {
      background-color: #9bbcf0;
      cursor: not-allowed;
    }

    /* Caixa de mensagens de feedback */
    .mensagem {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 500;
      display: none; /* Fica oculta até ser necessária */
    }

    .mensagem.sucesso {
      display: block;
      background-color: #e6f4ea;
      color: #137333;
      border: 1px solid #ceead6;
    }

    .mensagem.erro {
      display: block;
      background-color: #fce8e6;
      color: #c5221f;
      border: 1px solid #fad2cf;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Controle de Gastos</h1>
    <p class="subtitulo">Registre suas despesas direto na planilha</p>

    <form id="formGastos">
      <div class="campo">
        <label for="descricao">Descrição</label>
        <input type="text" id="descricao" placeholder="Ex: Almoço no restaurante" required>
      </div>

      <div class="campo">
        <label for="categoria">Categoria</label>
        <select id="categoria" required>
          <option value="" disabled selected>Selecione uma categoria...</option>
          <option value="Alimentação">Alimentação</option>
          <option value="Transporte">Transporte</option>
          <option value="Lazer">Lazer</option>
          <option value="Estudos">Estudos</option>
          <option value="Outros">Outros</option>
        </select>
      </div>

      <div class="campo">
        <label for="valor">Valor (R$)</label>
        <!-- step="0.01" permite digitar centavos -->
        <input type="number" id="valor" step="0.01" min="0.01" placeholder="0.00" required>
      </div>

      <button type="submit" id="btnSalvar">Salvar Gasto</button>
    </form>

    <div id="caixaMensagem" class="mensagem"></div>
  </div>

  <script>
    // Cole entre as aspas abaixo o link gerado na implantação do Google Apps Script
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzEcy2RkJetYJdyDEGhEyS6uEcCHvvkrK2HgVlCfuZdpYWamrImJR2rNAbJeutndCtTYA/exec";

    // Captura os elementos da tela para manipular com JavaScript
    const form = document.getElementById("formGastos");
    const btnSalvar = document.getElementById("btnSalvar");
    const caixaMensagem = document.getElementById("caixaMensagem");

    // Escuta o evento de envio do formulário
    form.addEventListener("submit", function(evento) {
      // Impede que a página recarregue ao clicar no botão
      evento.preventDefault();

      // Verifica se o usuário lembrou de colar a URL do script
      if (SCRIPT_URL === "COLE_AQUI_A_URL_DO_APP_SCRIPT" || SCRIPT_URL === "") {
        mostrarMensagem("Você precisa configurar a SCRIPT_URL no código primeiro!", "erro");
        return;
      }

      // Desabilita o botão e muda o texto para dar feedback visual
      btnSalvar.disabled = true;
      btnSalvar.textContent = "Salvando...";
      caixaMensagem.style.display = "none";

      // Monta o pacote de dados com o que foi digitado
      const dadosGasto = {
        descricao: document.getElementById("descricao").value.trim(),
        categoria: document.getElementById("categoria").value,
        valor: parseFloat(document.getElementById("valor").value)
      };

      // Envia os dados para o Google Apps Script
      fetch(SCRIPT_URL, {
        method: "POST",
        // text/plain evita bloqueios de segurança (CORS) dos navegadores com o Google
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(dadosGasto)
      })
      .then(function(resposta) {
        return resposta.json();
      })
      .then(function(resultado) {
        if (resultado.status === "sucesso") {
          mostrarMensagem("Gasto salvo com sucesso!", "sucesso");
          form.reset(); // Limpa os campos do formulário
        } else {
          mostrarMensagem(resultado.mensagem || "Erro ao salvar na planilha.", "erro");
        }
      })
      .catch(function(erro) {
        console.error("Erro na requisição:", erro);
        mostrarMensagem("Erro de conexão. Verifique sua internet ou a URL do script.", "erro");
      })
      .finally(function() {
        // Reabilita o botão independentemente de ter dado certo ou errado
        btnSalvar.disabled = false;
        btnSalvar.textContent = "Salvar Gasto";
      });
    });

    // Função auxiliar para exibir alertas na tela
    function mostrarMensagem(texto, tipo) {
      caixaMensagem.textContent = texto;
      caixaMensagem.className = "mensagem " + tipo;
    }
  </script>

</body>
</html>
